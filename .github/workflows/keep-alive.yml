name: keep-alive
# Supabase's free plan pauses a project after ~7 days without activity.
# The daily reminder job already runs inside the database; this is a second, independent ping.
on:
  schedule:
    - cron: '17 6 * * *' # daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.SUPABASE_URL }}/rest/v1/plans?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}")
          echo "HTTP $code"
          test "$code" -lt 500
